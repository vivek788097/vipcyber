<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIP Cyber Cafe Login</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial;background:linear-gradient(135deg,#07111f,#12345a);color:white}.card{width:min(380px,90%);padding:30px;background:rgba(255,255,255,.10);border:1px solid #ffffff30;border-radius:20px}h1{text-align:center}.sub{text-align:center;color:#bdd0e2;margin-bottom:25px}label{display:block;margin:12px 0 6px}input{width:100%;padding:12px;border-radius:9px;border:1px solid #50677e;background:#081522;color:white;box-sizing:border-box}.btn{width:100%;padding:13px;margin-top:18px;border:0;border-radius:9px;background:#1688e8;color:white;font-size:16px}.msg{text-align:center;color:#ff9292;margin-top:12px}
</style><div class="card"><h1>🔐 VIP Cyber Cafe</h1><div class="sub">Admin / Operator Login</div><form id="f"><label>Login ID</label><input id="id" required><label>Password</label><input id="pw" type="password" required><button class="btn">Login</button><div id="msg" class="msg"></div></form></div><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({loginId:id.value,password:pw.value})}),d=await r.json();if(d.ok)location=d.role==="admin"?"/admin":"/operator";else msg.textContent=d.message}</script>
